<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assistant · Snowflake Cortex Agent</title>
  <script>
    // Apply saved theme before first paint (default: light).
    document.documentElement.dataset.theme = localStorage.getItem('cawa-theme') === 'dark' ? 'dark' : 'light';
  </script>
  <style>
    /* Edit these three to brand the page. */
    :root { --brand: #29b5e8; --brand-ink: #ffffff; }
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    :root {
      --ink: light-dark(#14171f, #eef0f4);
      --muted: light-dark(#5d6474, #a7adba);
      --bg: light-dark(#f4f5f7, #0f1115);
      --card: light-dark(#ffffff, #181b22);
      --line: light-dark(#e2e5ea, #2a2f3a);
      --bubble-user: light-dark(#14171f, #eef0f4);
      --bubble-user-ink: light-dark(#ffffff, #14171f);
      --bubble-bot: light-dark(#f0f2f5, #232733);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .wrap { max-width: 820px; width: 100%; margin: 0 auto; padding: 0 16px; }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 60px; }
    .logo { font-weight: 800; font-size: 18px; }
    .logo small { font-weight: 500; font-size: 12px; color: var(--muted); margin-left: 8px; }
    .theme { border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 36px; height: 36px; border-radius: 999px; cursor: pointer; font-size: 16px; }
    main { flex: 1; display: flex; min-height: 0; }
    .chat { flex: 1; display: flex; flex-direction: column; min-height: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; margin: 16px auto; overflow: hidden; }
    .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 86%; padding: 10px 12px; border-radius: 14px; font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
    .msg.user { align-self: flex-end; background: var(--bubble-user); color: var(--bubble-user-ink); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
    .msg.bot ul { margin: 6px 0; padding-left: 18px; }
    .msg.bot p { margin: 0 0 6px; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .meta { font-size: 11px; color: var(--muted); align-self: flex-start; margin-top: -6px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 12px; }
    .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 7px 11px; border-radius: 999px; font-size: 13px; cursor: pointer; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: b 1.2s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    .composer { border-top: 1px solid var(--line); display: flex; gap: 8px; padding: 10px; }
    .composer textarea { flex: 1; resize: none; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 15px; background: var(--bg); color: var(--ink); }
    .composer button { border: 0; background: var(--brand); color: var(--brand-ink); border-radius: 10px; padding: 0 18px; font-weight: 700; cursor: pointer; }
    .composer button:disabled { opacity: .5; cursor: default; }
    .foot { font-size: 11px; color: var(--muted); padding: 0 12px 10px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap nav">
      <div class="logo">Assistant<small>powered by Snowflake Cortex Agents</small></div>
      <button class="theme" id="theme" type="button" aria-label="Toggle theme"></button>
    </div>
  </header>
  <main class="wrap">
    <section class="chat" aria-label="Chat with the assistant">
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="chips">
        <!-- Edit the suggested questions for your agent. -->
        <button class="chip" type="button">What can you help me with?</button>
        <button class="chip" type="button">Show me a quick summary of the data you can access</button>
      </div>
      <div class="composer">
        <textarea id="input" placeholder="Type your question…" maxlength="1000"></textarea>
        <button id="send" type="button">Send</button>
      </div>
      <div class="foot">Virtual assistant. Type "reset" to start over.</div>
    </section>
  </main>
  <script>
  (function () {
    var state = { sessionId: null, busy: false };
    var $ = function (id) { return document.getElementById(id); };
    var msgs = $('msgs'), input = $('input'), send = $('send'), themeBtn = $('theme');

    function paintTheme() { themeBtn.textContent = document.documentElement.dataset.theme === 'dark' ? '\u2600\ufe0f' : '\ud83c\udf19'; }
    themeBtn.addEventListener('click', function () {
      var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next; localStorage.setItem('cawa-theme', next); paintTheme();
    });
    paintTheme();

    function esc(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    // Minimal, safe Markdown: escape first, then bold/italic/lists/paragraphs.
    function md(text) {
      var out = [], list = false;
      esc(text).split(/\n/).forEach(function (raw) {
        var l = raw.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
        var m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)$/);
        if (m) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + m[1] + '</li>'); return; }
        if (list) { out.push('</ul>'); list = false; }
        if (l.trim()) out.push('<p>' + l + '</p>');
      });
      if (list) out.push('</ul>');
      return out.join('');
    }
    function add(role, text, meta) {
      var d = document.createElement('div');
      d.className = 'msg ' + role;
      if (role === 'bot') d.innerHTML = md(text); else d.textContent = text;
      msgs.appendChild(d);
      if (meta) { var m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; msgs.appendChild(m); }
      msgs.scrollTop = msgs.scrollHeight;
    }
    function typing() {
      var d = document.createElement('div');
      d.className = 'msg bot'; d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
      msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight; return d;
    }
    async function ask(text) {
      text = (text || '').trim();
      if (!text || state.busy) return;
      state.busy = true; send.disabled = true; input.value = '';
      add('user', text);
      var t = typing(), t0 = Date.now();
      try {
        var r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: state.sessionId }) });
        var d = await r.json();
        t.remove();
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        state.sessionId = d.session_id;
        add('bot', d.reply, 'Cortex Agent · ' + ((Date.now() - t0) / 1000).toFixed(1) + ' s');
      } catch (e) {
        t.remove();
        add('bot', 'Sorry, something went wrong. Please try again in a moment.');
      } finally {
        state.busy = false; send.disabled = false; input.focus();
      }
    }
    add('bot', 'Hi! Ask me anything about the data I have access to.');
    send.addEventListener('click', function () { ask(input.value); });
    input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function (b) {
      b.addEventListener('click', function () { ask(b.textContent); });
    });
  })();
  </script>
</body>
</html>
